[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlab"
version = "0.1.0"
description = "Train reinforcement-learning agents on any 3D MuJoCo simulation, or describe one in plain English and let TrainLab build it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.1",
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch",
    "numpy",
    "tensorboard",
    "imageio[ffmpeg]",
    "matplotlib",
    "pyyaml",
    "pygame",
    "psutil",
]

[project.optional-dependencies]
studio = ["gradio>=4", "anthropic", "openai>=1.40", "python-dotenv", "trimesh", "requests"]
dev = ["pytest"]

[project.scripts]
trainlab = "trainlab.cli:main"

[tool.setuptools.packages.find]
include = ["trainlab*"]

[tool.setuptools.package-data]
trainlab = ["assets/*", "configs/*.yaml", "generator/prompts/*", "scenarios/_template.py"]
